<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<style>
    /* Estilos para o formulário */
    form {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="color"],
    input[type="file"],
    input[type="search"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    input[type="submit"],
    input[type="button"] {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    input[type="submit"]:hover,
    input[type="button"]:hover {
        background-color: #45a049;
    }   


</style>

<body>
    <h1>Cadastro</h1>

    <form action="processar.php" method="post">
        <!--form cria um formulario, action define o destino dos dados, method define o metodo de envio dos dados-->
        <label for="nome">Nome:</label>
        <!--label cria um rótulo para um elemento de formulário, for associa o rótulo a um elemento específico-->
        <input type="text" id="nome" name="nome" required>
        <!--input cria um campo de entrada, type define o tipo de campo, id é usado para associar o rótulo, name é o nome do campo que será enviado, required torna o campo obrigatório-->
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
        <br>
        <input type="submit" value="Cadastrar">
        <!--input com type submit cria um botão de envio, value define o texto do botão-->
    </form>

    <form>
        <!--Label para o campo de nome e input para um campo de entrada-->
        <label for="Nome">Nome: </label>
        <input type="text" id="Nome" name="nome" placeholder="Digite seu nome completo" maxlength="30" required />
        <!--placeholder exibe um texto dentro do campo de entrada, maxlength define o número máximo de caracteres, required torna o campo obrigatório-->
        <br>
        <label for="Senha">Senha:</label>
        <input type="password" id="Senha" name="senha" placeholder="Digite sua senha" maxlength="20" required>
        <br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="email" placeholder="Digite seu email" required>
        <br>
        <label for="Idade"> Idade:</label>
        <input type="number" id="Idade" name="idade" placeholder="Digite sua idade" min="0" max="100" required>
        <!--min e max definem os valores mínimo e máximo permitidos-->
        <br>
        <label for="Data">Data de Nascimento:</label>
        <input type="date" id="Data" name="data" required>
        <!--type date cria um campo de entrada para data-->
        <br>
        <label for="Volume">Volume:</label>
        <input type="range" id="Volume" name="volume" min="0" max="100" required>
        <!--type range cria um campo de entrada para selecionar um valor dentro de um intervalo-->
        <br>
        <label for="Hora">Hora:</label>
        <input type="time" id="Hora" name="hora" required>
        <!--type time cria um campo de entrada para seleção de hora-->
        <br>
        <label for="Cor">Cor:</label>
        <input type="color" id="Cor" name="cor" required>
        <!--type color cria um campo de entrada para seleção de cor-->
        <br>
        <label for="Arquivo">Arquivo:</label>
        <input type="file" id="Arquivo" name="arquivo" required>
        <!--type file cria um campo de entrada para seleção de arquivo-->
        <br>
        <label for="Aceito">Aceito os termos e condições</label>
        <input type="checkbox" id="Aceito" name="aceito" required>
        <!--type checkbox cria uma caixa de seleção, required torna a seleção obrigatória-->
        <br>
        <label for="Escolaridade"></label>Escolaridade:</label> <br>
        <input type="radio" id="Fundamental" name="escolaridade" value="Fundamental" required>
        <label for="Fundamental">Fundamental</label> <br>    
        <input type="radio" id="Medio" name="escolaridade" value="Medio" required>
        <label for="Medio">Médio</label> <br>   
        <input type="radio" id="Superior" name="escolaridade" value="Superior" required>
        <label for="Superior">Superior</label> <br>
        <!--type radio cria um botão de opção, name deve ser o mesmo para agrupar as opções, value define o valor que será enviado, required torna a seleção obrigatória-->
        <br>
        <label for="Pesquisar">Pesquisar:</label>
        <input type="search" id="Busca" name="busca" placeholder="Digite sua busca" required>
        <!--type search cria um campo de entrada para pesquisa-->
        <br>
        <input type="hidden">
        <input type="button" value="Clique aqui" onclick="alert('Botão clicado!')">
        <!--type button cria um botão, value define o texto do botão, onclick define uma ação a ser executada quando o botão for clicado-->


    </form>
















</body>

</html>
